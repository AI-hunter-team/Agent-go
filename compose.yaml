services:
  app:
    image: agent-go:local
    build:
      context: .
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "${APP_HOST:-127.0.0.1}:${APP_PORT:-8080}:8787"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8787"
      AGENT_PROVIDER: "${AGENT_PROVIDER:-responses}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.deepseek.com}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      AGENT_MODEL: "${AGENT_MODEL:-deepseek-flash}"
      OPENAI_REASONING_EFFORT: "${OPENAI_REASONING_EFFORT:-none}"
      OPENAI_STREAM: "${OPENAI_STREAM:-1}"
      NPC_PROVIDER: "${NPC_PROVIDER:-responses}"
      NPC_MODEL: "${NPC_MODEL:-}"
      NPC_OPENAI_BASE_URL: "${NPC_OPENAI_BASE_URL:-https://api.deepseek.com}"
      NPC_OPENAI_API_KEY: "${NPC_OPENAI_API_KEY:-}"
      DECISION_MAX_TOKENS: "${DECISION_MAX_TOKENS:-4096}"
      DEBUG_LOG_ENABLED: "${DEBUG_LOG_ENABLED:-1}"
      DEBUG_LOG_DIR: /app/logs
    volumes:
      - debug-logs:/app/logs

volumes:
  debug-logs:
