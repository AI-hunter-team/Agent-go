name: Compose smoke

on:
  pull_request:
    paths:
      - Dockerfile
      - LICENSE
      - THIRD_PARTY_NOTICES.md
      - licenses/**
      - .node-version
      - .dockerignore
      - compose.yaml
      - package*.json
      - server/**
      - src/**
      - scripts/smoke-compose.mjs
      - scripts/license-notices.mjs
      - .github/workflows/compose.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.node-version'
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Add a synthetic local environment file
        run: echo 'BUILD_CONTEXT_TEST=not-a-real-secret' > .env
      - name: Build and wait for healthy containers
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Exercise production HTTP and fake model configuration
        run: npm run test:compose
      - name: Container diagnostics
        if: always()
        run: docker compose ps --all && docker compose logs --no-color
      - name: Clean up
        if: always()
        run: docker compose down --remove-orphans
