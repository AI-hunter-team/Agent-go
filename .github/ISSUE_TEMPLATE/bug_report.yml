name: Bug report / 问题反馈
description: Report reproducible unexpected behavior / 反馈可复现的问题
body:
  - type: markdown
    attributes:
      value: "Please redact API keys, tokens and personal data. Security issues: see SECURITY.md. 请勿附带密钥或未经脱敏的日志。"
  - type: input
    id: version
    attributes:
      label: Version or commit / 版本
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, browser, Node or Docker / 运行环境
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Include seed, mode and model ID when relevant; never include credentials.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result / 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence / 脱敏证据
