name: Feature request / 功能建议
description: Describe a problem and a focused improvement / 描述需求与改进
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case / 使用场景与问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and alternatives / 建议行为与替代方案
    validations:
      required: true
